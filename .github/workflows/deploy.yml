name: Render webp of applets and deploy to GitHub Pages

on:
  schedule:
    - cron: '0 5-23/3 * * *'  # Runs every 3 hours between 05:00 and 23:00 UTC
  workflow_dispatch:

jobs:
  render-webp:
    runs-on: ubuntu-latest

    steps:
      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yq

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize submodule
        run: |
          git submodule init
          git submodule update --remote

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true

      - name: Install dependencies
        run: npm install

      - name: Check and lint contrib applets
        run: |
          # Default --max-render-time is 1s; apps that hit slow upstream APIs
          # (noderunnersgames) cancel the HTTP request and fail with
          # "context deadline exceeded". --skip-broken honours
          # `broken: true` in an app manifest so flaky upstream-dependent apps
          # do not gate the rest of the build.
          ./bin/pixlet.mjs check --recursive --skip-broken --max-render-time 30s src/contrib
          ./bin/pixlet.mjs lint --recursive src/contrib

      - name: (Re-)render applets
        run: |
          npm run render -- --skip-db

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
